; 加枪模板ini配置参数介绍

; 武器序号请务必按照顺序来写，从1开始
武器序号 = 1

; 类型请参考amxconst.inc第65行往下，CSW_开头的define
类型 = CSW_M249

; 0为普通换弹模式，1为散弹枪单发装弹模式
上弹模式 = 0

; 是否开启机瞄
开启机瞄 = 0

; 弹夹子弹，如果只想显示后备弹药的话（比如某龙炮或某雷神），请把该参数改为0，然后备用子弹设为弹药量
子弹数 = 200

; 备用子弹
备用子弹数 = 200

; 伤害倍数，以原类型的武器伤害值为基础，比如这里是M249伤害的1.13倍
伤害倍数 = 1.13

; 武器射速(秒)，这里是0.1秒每发
武器射速 = 0.1

; 开镜包括SG552瞄准镜，AWP瞄准镜，以及机瞄
武器开镜射速 = 0.1

; 消音模式只有M4A1和USP能够使用，而且是在机瞄模式关闭的情况下
武器消音射速 = 0.1

; 后坐力倍数，以原类型的武器后坐力值为基础，比如这里是0.85倍
武器后座 = 0.85
武器开镜后座 = 0.85
武器消音后座 = 0.85

; 子弹散射的幅度倍数，以原类型的武器散射值为基础，越小打的越准
武器准确度 = 0.65
武器开镜准确度 = 0.65
武器消音准确度 = 0.65

; 这俩单位为秒，仅M4A1和USP能够使用
开启消音时间 = 0.0
关闭消音时间 = 0.0

; 开启机瞄镜头拉近的角度，0 < 角度 < 180，正常角度为90
镜头距离 = 0.0

; 每think一次变化的fov数，听不懂的请写1.0
镜头变化幅度 = 0.0

; 开启机瞄需要的时间(秒)
开启速度 = 0.0

; 关闭机瞄需要的时间(秒)
关闭速度 = 0.0

; 单位为秒
换弹时间 = 4.8

; 上弹模式为1的时候，请注意填写这两个参数
散弹开始换弹时间 = 0.0
散弹结束换弹时间 = 0.0

; 掏出武器的时间，单位是(秒)
掏出时间 = 1.0

; 手持该武器时的行走速度，填0.0的话为原版速度
行走速度 = 0.0

; 手持该武器开镜时的行走速度，填0.0的话为原版速度
开镜行走速度 = 0.0

; 被该武器攻击到受到的击退，击退是由伤害来计算的，击退 = 伤害 * 该参数，填0.0的话则不使用
击退力度 = 0.0

价格 = 5750
子弹价格 = 60

; 可以使用该武器的队伍，1为T，2为CT，填0的话则为共用
队伍 = 0

; cstrike/sprites/weapon_***.txt就是这个
HUD菜单 = mg3
杀敌SPR = mg3

; 如果W模型有许多次模型，请修改这个值
W模型子模型序号 = 0
P模型 = models/p_mg3.mdl
V模型 = models/v_mg3.mdl
W模型 = models/w_mg3.mdl

; 机瞄开启时更换的模型
机瞄模型 = models/v_mg3.mdl

开枪声音1 = weapons/mg3.wav
开枪声音2 = weapons/mg3.wav
消音开枪声音1 = weapons/mg3.wav
消音开枪声音2 = weapons/mg3.wav

; “声音大小”其实是声音衰变的距离，1.0为不衰变，即全图能听到；0.0则是默认大小，取值范围 0.0 <= 值 <= 1.0
开枪声音大小 = 0.0
消音开枪声音大小 = 0.0

购买命令 = mg3

; 打开模型查看器，武器起点，有个参数Sequence#:0，这个数字按动作类型填写在这里
静止动作 = 0
换弹动作 = 3
掏出动作 = 4
射击动作1 = 1
射击动作2 = 2
射击动作3 = 2
散弹换弹开始 = 0
散弹换弹装弹 = 0
散弹换弹结束 = 0
机瞄开启动作 = 0
机瞄关闭动作 = 0
消音开启动作 = 0
消音关闭动作 = 0
消音静止动作 = 0
消音换弹动作 = 0
消音掏出动作 = 0
消音射击动作1 = 0
消音射击动作2 = 0
消音射击动作3 = 0

