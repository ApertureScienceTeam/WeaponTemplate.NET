; 加枪模板ini配置参数介绍

; 武器序号请务必按照顺序来写
武器序号 = 1

; 掏出手雷的时间，单位是(秒)
掏出时间 = 1.0

; 丢出去之后多少秒爆炸
爆炸时间 = 1.35

; 手雷爆炸的半径，单位是(英寸)
爆炸范围 = 350.0

; 伤害的倍数，伤害 = 100 * 倍数，而且伤害会通过计算玩家与手雷的距离呈线性衰减
伤害倍数 = 2.0

; 手持该武器时的行走速度，填0.0的话为原版速度
行走速度 = 0.0

; 购买价格
价格 = 300

; 可以使用该武器的队伍，填0的话则为共用
队伍 = 0

; cstrike/sprites/weapon_***.txt就是这个
HUD菜单 = holybomb
杀敌SPR = holybomb

; 如果W模型有许多次模型，请修改这个值
W模型子模型序号 = 0
P模型 = models/p_holybomb.mdl
V模型 = models/v_holybomb.mdl
W模型 = models/w_holybomb.mdl
爆炸SPR = sprites/ef_hwater.spr
爆炸声音 = weapons/explode3.wav

; “声音大小”其实是声音衰变的距离，1.0为不衰变，即全图能听到；0.0则是默认大小 取值范围 0.0 <= 值 <= 1.0
爆炸声音大小 = 0.0

; 在控制台输入该命令就能够购买该武器
购买命令 = holybomb

; 空白的模板

武器序号 = 
掏出时间 = 
爆炸时间 = 
爆炸范围 = 
伤害倍数 = 
