; 加枪模板ini配置参数介绍

; 武器序号请务必按照顺序来写
武器序号 = 1

; 相当于刀子左键的攻击速度，单位是(秒)
轻击结束时间 = 1.4

; 左键的攻击延迟，填0.0的话则是无延迟，单位是(秒)
轻击延迟时间 = 0.0

; 攻击距离，单位是(英寸，unit)
轻击距离 = 72.0

; 如果是范围性攻击的话请改成大于0.0，单位是(度)，范围是 0.0 < 角度 < 180.0
轻击角度 = 0.0

; 范围性攻击可使用，水平方向每多少单位判断一次击中位置，建议值：5.0 <= 间隔 <= 轻击角度，听不懂建议填5.0
轻击角度判断间隔 = 0.0

; 范围性攻击可使用，范围攻击的高度值，建议值：1.0 <= 高度 <= 50.0，听不懂建议填10.0
轻击高度 = 0.0

; 范围性攻击可使用，垂直方向每多少单位判断一次击中位置，建议值：5.0 <= 间隔 <= 轻击高度，听不懂建议填5.0
轻击高度判断间隔 = 0.0

; 相当于刀子右键的攻击速度，单位是(秒)
重击结束时间 = 2.0

; 右键的攻击延迟，填0.0的话则是无延迟，单位是(秒)
重击延迟时间 = 0.0

; 攻击距离，单位是(英寸，unit)
重击距离 = 72.0

; 如果是范围性攻击的话请改成大于0.0，单位是(度)，范围是 0.0 < 角度 < 180.0
重击角度 = 0.0

; 范围性攻击可使用，水平方向每多少单位判断一次击中位置，建议值：5.0 <= 间隔 <= 重击角度，听不懂建议填5.0
重击角度判断间隔 = 0.0

; 范围性攻击可使用，范围攻击的高度值，建议值：1.0 <= 高度 <= 50.0，听不懂建议填10.0
重击高度 = 0.0

; 范围性攻击可使用，垂直方向每多少单位判断一次击中位置，建议值：5.0 <= 间隔 <= 重击高度，听不懂建议填5.0
重击高度判断间隔 = 0.0

; 掏出刀子的时间，单位是(秒) 
掏出时间 = 1.0

; 刀子轻击的伤害倍数
伤害倍数 = 4.625

; 刀子重击的伤害倍数
重击伤害倍数 = 4.625

; 手持该武器时的行走速度，填0.0的话为原版速度
行走速度 = 0.0

; 被该武器攻击到受到的击退，击退是由伤害来计算的，击退 = 伤害 * 该参数，填0.0的话则不使用
击退 = 0.0

; 购买价格
价格 = 0

; 可以使用该武器的队伍，填0的话则为共用
队伍 = 0

; cstrike/sprites/weapon_***.txt就是这个
HUD菜单 = nataknife
杀敌SPR = nataknife

P模型 = models/p_nataknife.mdl
V模型 = models/v_nataknife.mdl

掏出声音 = weapons/strong_knife_draw.wav
击墙声音 = weapons/strong_knife_hitwall.wav
击空声音 = weapons/strong_knife_miss.wav
重击声音 = weapons/strong_knife_stab.wav
轻击声音1 = weapons/strong_knife_hit1.wav
轻击声音2 = weapons/strong_knife_hit2.wav

; “声音大小”其实是声音衰变的距离，1.0为不衰变，即全图能听到；0.0则是默认大小，取值范围 0.0 <= 值 <= 1.0
击墙声音大小 = 0.0
击空声音大小 = 0.0
重击声音大小 = 0.0
轻击声音1大小 = 0.0
轻击声音2大小 = 0.0

; 在控制台输入该命令就能够购买该武器
购买命令 = nataknife

; 打开模型查看器，武器起点，有个参数Sequence#:0，这个数字按动作类型填写在这里
静止动作 = 0
轻击动作1 = 1
轻击动作2 = 2
掏出动作 = 3
重击动作 = 4
重击未击中动作 = 5
轻击动作 = 6
轻击未击中动作 = 7
轻击开始动作 = 0
重击开始动作 = 0

